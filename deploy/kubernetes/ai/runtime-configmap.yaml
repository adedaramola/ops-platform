apiVersion: v1
kind: ConfigMap
metadata:
  name: opsdesk-agent-runtime
  namespace: opsdesk
  labels:
    app.kubernetes.io/name: opsdesk-agent
    app.kubernetes.io/part-of: opsdesk
data:
  OPS_AGENT_QUEUE_URL: REPLACE_WITH_AI_QUEUE_URL
  OPS_AGENT_OPSDESK_BASE_URL: http://opsdesk.opsdesk.svc.cluster.local
  OPS_AGENT_REQUEST_TIMEOUT_SECONDS: "25"
  OPS_AGENT_TOTAL_DEADLINE_SECONDS: "120"
  OPS_AGENT_MAX_STEPS: "3"
  OPS_AGENT_TOKEN_BUDGET: "2000"
  OPS_AGENT_WAIT_TIME_SECONDS: "20"
  OPS_AGENT_LLM_GATEWAY_ENABLED: "true"
  OPS_AGENT_LLM_GATEWAY_BASE_URL: REPLACE_WITH_LLM_GATEWAY_URL
  OPS_AGENT_LLM_GATEWAY_API_KEY_SECRET_ARN: REPLACE_WITH_LLM_GATEWAY_SECRET_ARN
  OPS_AGENT_LLM_GATEWAY_CACHE_POLICY: "off"
  OPS_AGENT_LLM_GATEWAY_MAX_TOKENS: "512"
  OPS_AGENT_LLM_GATEWAY_TEMPERATURE: "0.2"
  OPS_AGENT_RAG_ENABLED: "false"
  OPS_AGENT_RAG_BASE_URL: REPLACE_WITH_RAG_URL
  OPS_AGENT_RAG_API_KEY_SECRET_ARN: REPLACE_WITH_RAG_SECRET_ARN
  OPS_AGENT_RAG_SOURCE_IDS: "[]"
  OPS_AGENT_RAG_MAX_CHUNKS: "5"
