apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsdesk-agent
  namespace: opsdesk
  labels:
    app.kubernetes.io/name: opsdesk-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: opsdesk
    app.kubernetes.io/version: 0.7.1
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opsdesk-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsdesk-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: opsdesk
    spec:
      serviceAccountName: opsdesk-agent
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: opsdesk:0.7.1
          imagePullPolicy: IfNotPresent
          command:
            - opsdesk-agent
          envFrom:
            - configMapRef:
                name: opsdesk-agent-runtime
          env:
            - name: OPS_AGENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opsdesk-runtime
                  key: OPS_AI_INTERNAL_TOKEN
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
