{% extends "base.html" %}
{% block title %}Register · OpsDesk{% endblock %}
{% block content %}
<section class="card">
  <h1>Create an account</h1>
  <p>Passwords must be at least 12 characters and use three character classes.</p>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required maxlength="320">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
    <button type="submit">Register</button>
  </form>
  <p><a href="/login">Already have an account?</a></p>
</section>
{% endblock %}
