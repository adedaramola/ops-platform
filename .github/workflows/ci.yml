name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: opsdesk_db
          POSTGRES_USER: opsdesk
          POSTGRES_PASSWORD: opsdesk_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsdesk -d opsdesk_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPS_ENVIRONMENT: test
      OPS_DATABASE_URL: postgresql+psycopg://opsdesk:opsdesk_test_only@localhost:5432/opsdesk_db
      OPS_CSRF_SECRET_KEY: ci-only-csrf-secret-not-for-production
      OPS_SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format
        run: ruff format --check src tests migrations
      - name: Lint
        run: ruff check src tests migrations
      - name: Type check
        run: mypy
      - name: Migrate
        run: alembic upgrade head
      - name: Verify migration consistency
        run: alembic check
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Build wheel
        run: python -m pip install build && python -m build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t opsdesk:${{ github.sha }} .
      - name: Verify non-root image user
        run: test "$(docker image inspect opsdesk:${{ github.sha }} --format '{{.Config.User}}')" = "opsdesk"
