[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdesk"
version = "0.6.0"
description = "Production-minded support ticket and knowledge management application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "boto3>=1.40,<2.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "jinja2>=3.1,<4.0",
  "opentelemetry-api>=1.44,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<0.66",
  "opentelemetry-sdk>=1.44,<2.0",
  "prometheus-client>=0.26,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0.41,<3.0",
  "structlog>=25.4,<26.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2.0",
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<8.0",
  "pyyaml>=6.0,<7.0",
  "ruff==0.16.3",
  "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
opsdesk-seed = "opsdesk.cli:seed_dev_data"
opsdesk-traffic = "opsdesk.traffic.cli:main"
opsdesk-ai-dispatch = "opsdesk.ai.dispatch:main"
opsdesk-agent = "opsdesk.agent.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsdesk = ["py.typed", "templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL test database",
]

[tool.coverage.run]
branch = true
source = ["opsdesk"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
omit = [
  "src/opsdesk/cli.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["opsdesk"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
